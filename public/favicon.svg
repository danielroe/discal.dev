<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="ball" cx="38%" cy="32%" r="60%">
      <stop offset="0%" stop-color="#e8e8f0"/>
      <stop offset="60%" stop-color="#c0c0d4"/>
      <stop offset="100%" stop-color="#8888aa"/>
    </radialGradient>
    <linearGradient id="hat" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ec4899"/>
      <stop offset="100%" stop-color="#be185d"/>
    </linearGradient>
  </defs>

  <!-- Shadow -->
  <ellipse cx="256" cy="468" rx="110" ry="18" fill="#0001" opacity="0.5"/>

  <!-- Disco ball body -->
  <circle cx="256" cy="272" r="186" fill="url(#ball)" stroke="#7777a0" stroke-width="4"/>

  <!-- Facet grid - horizontal -->
  <path d="M 115 190 Q 256 168 397 190" fill="none" stroke="#9999bb" stroke-width="3.5" opacity="0.7"/>
  <path d="M 82 235 Q 256 210 430 235" fill="none" stroke="#9999bb" stroke-width="3.5" opacity="0.7"/>
  <path d="M 72 280 Q 256 255 440 280" fill="none" stroke="#9999bb" stroke-width="3.5" opacity="0.7"/>
  <path d="M 76 325 Q 256 300 436 325" fill="none" stroke="#9999bb" stroke-width="3.5" opacity="0.7"/>
  <path d="M 90 365 Q 256 340 422 365" fill="none" stroke="#9999bb" stroke-width="3.5" opacity="0.7"/>
  <path d="M 125 400 Q 256 378 387 400" fill="none" stroke="#9999bb" stroke-width="3.5" opacity="0.7"/>

  <!-- Facet grid - vertical -->
  <path d="M 180 90 Q 168 272 180 454" fill="none" stroke="#9999bb" stroke-width="3.5" opacity="0.7"/>
  <path d="M 256 86 Q 256 272 256 458" fill="none" stroke="#9999bb" stroke-width="3.5" opacity="0.7"/>
  <path d="M 332 90 Q 344 272 332 454" fill="none" stroke="#9999bb" stroke-width="3.5" opacity="0.7"/>

  <!-- Big shiny facet highlights -->
  <rect x="135" y="195" width="38" height="30" rx="4" fill="#fff" opacity="0.45" transform="rotate(-4 154 210)"/>
  <rect x="270" y="190" width="38" height="30" rx="4" fill="#fff" opacity="0.5" transform="rotate(3 289 205)"/>
  <rect x="190" y="280" width="38" height="30" rx="4" fill="#fff" opacity="0.35" transform="rotate(-2 209 295)"/>
  <rect x="310" y="320" width="38" height="30" rx="4" fill="#fff" opacity="0.3" transform="rotate(4 329 335)"/>
  <rect x="145" y="350" width="32" height="25" rx="4" fill="#fff" opacity="0.25" transform="rotate(3 161 362)"/>
  <rect x="280" y="250" width="32" height="25" rx="4" fill="#fff" opacity="0.4" transform="rotate(-3 296 262)"/>
  <rect x="200" y="155" width="30" height="24" rx="4" fill="#fff" opacity="0.55"/>
  <rect x="340" y="230" width="30" height="24" rx="4" fill="#fff" opacity="0.35" transform="rotate(-5 355 242)"/>

  <!-- Specular shine -->
  <circle cx="210" cy="190" r="60" fill="#fff" opacity="0.15"/>

  <!-- Party hat -->
  <polygon points="256,30 190,148 322,148" fill="url(#hat)" stroke="#9d174d" stroke-width="4" stroke-linejoin="round"/>
  <!-- Hat band -->
  <path d="M 198 140 Q 256 156 314 140" fill="none" stroke="#facc15" stroke-width="7" stroke-linecap="round"/>
  <!-- Hat pom-pom -->
  <circle cx="256" cy="30" r="18" fill="#facc15"/>
  <circle cx="256" cy="30" r="11" fill="#eab308"/>

  <!-- Eyes -->
  <ellipse cx="206" cy="262" rx="42" ry="46" fill="white" stroke="#4444" stroke-width="3"/>
  <ellipse cx="214" cy="264" rx="24" ry="28" fill="#1e1b4b"/>
  <ellipse cx="224" cy="252" rx="10" ry="11" fill="white"/>
  <circle cx="206" cy="274" r="5" fill="white" opacity="0.4"/>

  <ellipse cx="306" cy="262" rx="42" ry="46" fill="white" stroke="#4444" stroke-width="3"/>
  <ellipse cx="298" cy="264" rx="24" ry="28" fill="#1e1b4b"/>
  <ellipse cx="288" cy="252" rx="10" ry="11" fill="white"/>
  <circle cx="306" cy="274" r="5" fill="white" opacity="0.4"/>

  <!-- Smile -->
  <path d="M 222 314 Q 256 346 290 314" fill="none" stroke="#9d174d" stroke-width="5" stroke-linecap="round"/>

  <!-- Blush -->
  <ellipse cx="172" cy="305" rx="20" ry="12" fill="#fb7185" opacity="0.5"/>
  <ellipse cx="340" cy="305" rx="20" ry="12" fill="#fb7185" opacity="0.5"/>

  <!-- Sparkles -->
  <g transform="translate(420, 120)">
    <line x1="0" y1="-22" x2="0" y2="22" stroke="#22d3ee" stroke-width="5" stroke-linecap="round"/>
    <line x1="-22" y1="0" x2="22" y2="0" stroke="#22d3ee" stroke-width="5" stroke-linecap="round"/>
    <line x1="-13" y1="-13" x2="13" y2="13" stroke="#22d3ee" stroke-width="3.5" stroke-linecap="round"/>
    <line x1="13" y1="-13" x2="-13" y2="13" stroke="#22d3ee" stroke-width="3.5" stroke-linecap="round"/>
  </g>
  <g transform="translate(88, 150)">
    <line x1="0" y1="-16" x2="0" y2="16" stroke="#facc15" stroke-width="4.5" stroke-linecap="round"/>
    <line x1="-16" y1="0" x2="16" y2="0" stroke="#facc15" stroke-width="4.5" stroke-linecap="round"/>
    <line x1="-10" y1="-10" x2="10" y2="10" stroke="#facc15" stroke-width="3" stroke-linecap="round"/>
    <line x1="10" y1="-10" x2="-10" y2="10" stroke="#facc15" stroke-width="3" stroke-linecap="round"/>
  </g>
  <g transform="translate(440, 360)">
    <line x1="0" y1="-13" x2="0" y2="13" stroke="#22d3ee" stroke-width="4" stroke-linecap="round"/>
    <line x1="-13" y1="0" x2="13" y2="0" stroke="#22d3ee" stroke-width="4" stroke-linecap="round"/>
  </g>
  <g transform="translate(78, 380)">
    <line x1="0" y1="-10" x2="0" y2="10" stroke="#facc15" stroke-width="3.5" stroke-linecap="round"/>
    <line x1="-10" y1="0" x2="10" y2="0" stroke="#facc15" stroke-width="3.5" stroke-linecap="round"/>
  </g>
</svg>
