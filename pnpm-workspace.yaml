catalog:
  vite: npm:@voidzero-dev/vite-plus-core@0.3.3
  vitest: 5.0.2
  vite-plus: 0.3.3

overrides:
  vite: 'catalog:'
  vitest: 'catalog:'

peerDependencyRules:
  allowAny:
    - vite
    - vitest
  allowedVersions:
    vite: '*'
    vitest: '*'

allowBuilds:
  '@parcel/watcher': false
  core-js: false
  esbuild: false
  sharp: true
  vue-demi: false
